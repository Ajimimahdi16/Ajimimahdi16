<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace}
.b{font-weight:700}
.bb{font-weight:800}
.tb{transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

@keyframes fl{0%{transform:translateY(0)}50%{transform:translateY(-5px)}100%{transform:translateY(0)}}
@keyframes goal{0%{opacity:0;transform:scale(.4)}55%{opacity:0;transform:scale(.4)}58%{opacity:1;transform:scale(1.15)}62%{opacity:1;transform:scale(1)}78%{opacity:1;transform:scale(1)}84%{opacity:0;transform:scale(1)}100%{opacity:0}}
@keyframes ballv{0%{opacity:1}60%{opacity:1}64%{opacity:0}96%{opacity:0}100%{opacity:1}}
@keyframes shake{0%{transform:rotate(0)}5%{transform:rotate(-4deg)}10%{transform:rotate(4deg)}15%{transform:rotate(-4deg)}20%{transform:rotate(4deg)}25%{transform:rotate(0)}100%{transform:rotate(0)}}
@keyframes backv{0%{opacity:1;transform:scaleX(1)}36%{opacity:1;transform:scaleX(1)}42%{opacity:1;transform:scaleX(0)}43%{opacity:0;transform:scaleX(0)}92%{opacity:0;transform:scaleX(0)}97%{opacity:1;transform:scaleX(1)}100%{opacity:1;transform:scaleX(1)}}
@keyframes frontv{0%{opacity:0;transform:scaleX(0)}42%{opacity:0;transform:scaleX(0)}43%{opacity:1;transform:scaleX(0)}50%{opacity:1;transform:scaleX(1)}90%{opacity:1;transform:scaleX(1)}92%{opacity:1;transform:scaleX(0)}93%{opacity:0;transform:scaleX(0)}100%{opacity:0;transform:scaleX(0)}}
@keyframes fall{0%{opacity:0;transform:translateY(-30px) rotate(0)}48%{opacity:0;transform:translateY(-30px) rotate(0)}50%{opacity:1}76%{opacity:0;transform:translateY(190px) rotate(300deg)}100%{opacity:0}}
@keyframes bar{0%{transform:scaleX(0)}50%{transform:scaleX(0)}62%{transform:scaleX(1)}90%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.pl{animation:fl 3.2s ease-in-out infinite}
.goal{animation:goal 9s infinite}.ballv{animation:ballv 9s infinite}
.shake{animation:shake 9s infinite}
.back{animation:backv 9s infinite}.front{animation:frontv 9s infinite}
.cf{animation:fall 9s ease-in infinite both}
.bar{animation:bar 9s infinite;transform-box:fill-box;transform-origin:left center}
.hint{animation:blink 1.2s steps(1) infinite}</style>

