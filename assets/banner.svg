<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Mahdi Ajimi, Junior Full Stack Developer">
<title>Mahdi Ajimi, Junior Full Stack Developer</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace}
.b{font-weight:700}
.bb{font-weight:800}
.tb{transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

@keyframes gridmove{0%{transform:translate(0,0)}100%{transform:translate(-36px,-36px)}}
@keyframes scan{0%{transform:translateY(-6px);opacity:0}10%{opacity:.7}90%{opacity:.7}100%{transform:translateY(306px);opacity:0}}
@keyframes typew{0%{width:0}30%{width:348px}100%{width:348px}}
@keyframes curx{0%{transform:translateX(0)}30%{transform:translateX(348px)}100%{transform:translateX(348px)}}
@keyframes w1{0%{opacity:0}2%{opacity:1}31%{opacity:1}33%{opacity:0}100%{opacity:0}}
@keyframes w2{0%{opacity:0}33%{opacity:0}35%{opacity:1}64%{opacity:1}66%{opacity:0}100%{opacity:0}}
@keyframes w3{0%{opacity:0}66%{opacity:0}68%{opacity:1}97%{opacity:1}99%{opacity:0}100%{opacity:0}}
.grid{animation:gridmove 6s linear infinite}
.scan{animation:scan 5s linear infinite}
.typew{animation:typew 9s steps(29,end) infinite}
.cur{animation:curx 9s steps(29,end) infinite}
.curb{animation:blink 1s steps(1) infinite}
.o1{transform-origin:0 0;animation:spin 46s linear infinite}
.o2{transform-origin:0 0;animation:spinr 28s linear infinite}
.o3{transform-origin:0 0;animation:spin 9s linear infinite}
.o4{transform-origin:0 0;animation:spin 14s linear infinite}
.o5{transform-origin:0 0;animation:spinr 9s linear infinite}
.core{animation:pulse 3s ease-in-out infinite}
.l1{animation:w1 9s infinite}.l2{animation:w2 9s infinite}.l3{animation:w3 9s infinite}
.dot{animation:blink 1.4s infinite}
</style>

