<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="Animated preview of a spare parts management app: searching for a bumper and seeing which parts are available or sold" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .mono { font-family: 'Courier New', Courier, monospace; }
  .sans { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
  @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-28px); } }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes pulse { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(3); opacity: 0; } }
  @keyframes type {
    0%, 8% { transform: translateX(0); animation-timing-function: steps(15, end); }
    32%, 88% { transform: translateX(180px); animation-timing-function: steps(15, end); }
    96%, 100% { transform: translateX(0); }
  }
  @keyframes in1 { 0%, 36% { opacity: 0; transform: translateY(10px); } 42%, 90% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
  @keyframes in2 { 0%, 44% { opacity: 0; transform: translateY(10px); } 50%, 90% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
  @keyframes in3 { 0%, 52% { opacity: 0; transform: translateY(10px); } 58%, 90% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
  .strip { animation: slide 1s linear infinite; }
  .typer { animation: type 9s infinite; }
  .caret { animation: blink 1s step-end infinite; }
  .ring { transform-box: fill-box; transform-origin: center; animation: pulse 1.6s ease-out infinite; }
  .r1 { animation: in1 9s infinite; }
  .r2 { animation: in2 9s infinite; }
  .r3 { animation: in3 9s infinite; }
</style>
<defs>
  <clipPath id="card"><rect width="800" height="360" rx="16"/></clipPath>
</defs>

<rect x="1" y="1" width="798" height="358" rx="16" fill="#0d0d0d" stroke="#FFD700" stroke-width="2"/>

<g clip-path="url(#card)">
  <g class="strip"><polygon points="-28,8 -20,0 -6,0 -14,8" fill="#FFD700"/><polygon points="0,8 8,0 22,0 14,8" fill="#FFD700"/><polygon points="28,8 36,0 50,0 42,8" fill="#FFD700"/><polygon points="56,8 64,0 78,0 70,8" fill="#FFD700"/><polygon points="84,8 92,0 106,0 98,8" fill="#FFD700"/><polygon points="112,8 120,0 134,0 126,8" fill="#FFD700"/><polygon points="140,8 148,0 162,0 154,8" fill="#FFD700"/><polygon points="168,8 176,0 190,0 182,8" fill="#FFD700"/><polygon points="196,8 204,0 218,0 210,8" fill="#FFD700"/><polygon points="224,8 232,0 246,0 238,8" fill="#FFD700"/><polygon points="252,8 260,0 274,0 266,8" fill="#FFD700"/><polygon points="280,8 288,0 302,0 294,8" fill="#FFD700"/><polygon points="308,8 316,0 330,0 322,8" fill="#FFD700"/><polygon points="336,8 344,0 358,0 350,8" fill="#FFD700"/><polygon points="364,8 372,0 386,0 378,8" fill="#FFD700"/><polygon points="392,8 400,0 414,0 406,8" fill="#FFD700"/><polygon points="420,8 428,0 442,0 434,8" fill="#FFD700"/><polygon points="448,8 456,0 470,0 462,8" fill="#FFD700"/><polygon points="476,8 484,0 498,0 490,8" fill="#FFD700"/><polygon points="504,8 512,0 526,0 518,8" fill="#FFD700"/><polygon points="532,8 540,0 554,0 546,8" fill="#FFD700"/><polygon points="560,8 568,0 582,0 574,8" fill="#FFD700"/><polygon points="588,8 596,0 610,0 602,8" fill="#FFD700"/><polygon points="616,8 624,0 638,0 630,8" fill="#FFD700"/><polygon points="644,8 652,0 666,0 658,8" fill="#FFD700"/><polygon points="672,8 680,0 694,0 686,8" fill="#FFD700"/><polygon points="700,8 708,0 722,0 714,8" fill="#FFD700"/><polygon points="728,8 736,0 750,0 742,8" fill="#FFD700"/><polygon points="756,8 764,0 778,0 770,8" fill="#FFD700"/><polygon points="784,8 792,0 806,0 798,8" fill="#FFD700"/><polygon points="812,8 820,0 834,0 826,8" fill="#FFD700"/><polygon points="840,8 848,0 862,0 854,8" fill="#FFD700"/></g>
</g>

<text x="50" y="48" class="sans" font-size="24" font-weight="800" fill="#FFD700" letter-spacing="1.5">SPARE PARTS MANAGER</text>
<text x="50" y="74" class="sans" font-size="14" fill="#aaa">Search used car parts and see instantly if they are available</text>

<circle cx="628" cy="44" r="5" fill="#FFD700"/>
<circle cx="628" cy="44" r="5" fill="none" stroke="#FFD700" stroke-width="1.5" class="ring"/>
