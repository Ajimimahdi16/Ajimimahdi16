  <text x="72" y="288" class="sans" font-size="16" font-weight="600" fill="#fff">Rear bumper</text>
  <text x="72" y="305" class="sans" font-size="13" fill="#999">Lancia Y &#183; 2010 &#183; Black &#183; Left</text>
  <rect x="640" y="279" width="100" height="24" rx="12" fill="#FFD700"/><text x="690" y="295" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#000">AVAILABLE</text>
</g>

<text x="50" y="344" class="sans" font-size="12" font-weight="700" fill="#FFD700" letter-spacing="2">REACT  &#183;  VITE  &#183;  EXPRESS  &#183;  MYSQL</text>
</svg>
