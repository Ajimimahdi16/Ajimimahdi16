  <text x="72" y="234" class="sans" font-size="16" font-weight="600" fill="#777">Front bumper</text>
  <text x="72" y="251" class="sans" font-size="13" fill="#999">Lancia Y &#183; 2005 &#183; Red &#183; Right</text>
  <rect x="640" y="225" width="100" height="24" rx="12" fill="none" stroke="#777" stroke-width="1.5"/><text x="690" y="241" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#888">SOLD</text>
